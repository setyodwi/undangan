<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zentih Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div id="loginPage" class="login-page">
  <div class="login-card">
    <h2>Zentih Admin</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Masuk</button>
  </div>
</div>

<div id="app" class="hidden">
<aside>
<h2>💍 Zentih</h2>
<button onclick="openMenu('dashboard')">Dashboard</button>
<button onclick="openMenu('tamu')">👥 Tamu</button>
<button onclick="openMenu('gallery')">🖼 Gallery</button>
<button onclick="openMenu('ucapan')">💌 Ucapan</button>
</aside>

<main>
<header>
<h1 id="title">Dashboard</h1>
<button onclick="logout()">Logout</button>
</header>

<section id="dashboard" class="page">
<div class="cards">
<div>Total Tamu<h1 id="totalTamu">0</h1></div>
<div>Ucapan<h1 id="totalUcapan">0</h1></div>
<div>Gallery<h1 id="totalGallery">0</h1></div>
</div>
</section>

<section id="tamu" class="page hidden">
<div class="card">
<h2>Data Tamu</h2>
<input id="search" onkeyup="filterTamu()" placeholder="Cari nama / WA">
<div>
<input id="nama" placeholder="Nama">
<input id="wa" placeholder="628xxx">
<button onclick="addTamu()">Tambah</button>
</div>
<table>
<thead><tr><th>Nama</th><th>WA</th><th>Aksi</th></tr></thead>
<tbody id="tamuTable"></tbody>
</table>
</div>
</section>

<section id="gallery" class="page hidden">
<div class="card">
<h2>Gallery</h2>
<input type="file" id="foto" multiple>
<button onclick="uploadFoto()">Upload</button>
<div id="galleryGrid" class="grid"></div>
</div>
</section>

<section id="ucapan" class="page hidden">
<div class="card">
<h2>Ucapan</h2>
<div id="ucapanList"></div>
</div>
</section>

</main>
</div>
<script src="admin.js"></script>
</body>
</html>
